name: Build and deploy decks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push queued behind it replaces any older queued run.
# Not cancel-in-progress: a deploy that is cut off half way leaves Pages in a bad state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble site
        run: node site/build.mjs --out _site --sha "$GITHUB_SHA"
      # Card thumbnails and slide counts for the gallery. Optional: without them the cards show a placeholder.
      - name: Card thumbnails
        continue-on-error: true
        timeout-minutes: 8
        env:
          PW_FROM: /tmp/pw
        run: |
          npm install --prefix /tmp/pw --no-save --no-audit --no-fund playwright-core@1.62.1 >/dev/null
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node site/thumbs.mjs --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub Pages occasionally stalls at "syncing_files"; give it longer, then try once more.
      - id: attempt1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 900000
      - id: attempt2
        if: steps.attempt1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
      - id: deployment
        run: echo "page_url=${{ steps.attempt1.outputs.page_url || steps.attempt2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
      - name: Wait until the live site serves this build
        run: |
          for i in $(seq 1 30); do
            live=$(curl -fsS "https://vinjamuriganeshmourya.github.io/Presentation_Decks/build.json?t=$(date +%s%N)" | sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p' || true)
            [ "$live" = "$GITHUB_SHA" ] && echo "live: $live" && exit 0
            sleep 4
          done
          echo "::warning::live build.json did not report $GITHUB_SHA yet"
      - name: Tell the edit Worker this commit is live (clears its temporary rows)
        if: ${{ vars.WORKER_URL != '' }}
        continue-on-error: true
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          curl -fsS -X POST "$WORKER_URL/api/deployed" \
            -H "Authorization: Bearer $DEPLOY_HOOK_TOKEN" \
            -H "content-type: application/json" \
            -d "{\"sha\":\"$GITHUB_SHA\"}"
